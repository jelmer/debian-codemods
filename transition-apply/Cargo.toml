[package]
name = "deb-transition-apply"
edition = "2021"
version.workspace = true
license = "GPL-3.0+"

[lib]

[dependencies]
breezyshim = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
deb822-lossless.workspace = true
debian-analyzer = { workspace = true, features = ["svp"] }
debian-control.workspace = true
debian-workspace.workspace = true
debversion.workspace = true
env_logger = { workspace = true, optional = true }
lazy-regex.workspace = true
lazy_static.workspace = true
log.workspace = true
regex.workspace = true
svp-client.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger", "dep:breezyshim"]

[[bin]]
name = "deb-transition-apply"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = { workspace = true }
